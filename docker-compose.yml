version: '3.8'

services:
  webrec:
    build: .
    container_name: webrec
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - VIDEO_WIDTH=1080
      - VIDEO_HEIGHT=1920
      - VIDEO_FPS=60
      - VIDEO_DURATION=30
      - OUTPUT_DIR=/app/recordings
    volumes:
      - ./recordings:/app/recordings
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
